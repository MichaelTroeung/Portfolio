<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero-header">
    <div class="brand">
      <span class="brand-name">Michael Troeung</span>
      <p class="brand-tag">Explore my work and experience</p>
    </div>
    <nav class="hero-nav">
      <div class="hero-row">
        <a class="bubble bubble--small bubble--a" data-index="0" style="--bubble-delay: 0.05s; --bubble-height: 5px;" href="experience.html">Experience</a>
        <a class="bubble bubble--medium bubble--b" data-index="1" style="--bubble-delay: 0.35s; --bubble-height: 9px;" href="education.html">Education</a>
        <a class="bubble bubble--large bubble--c" data-index="2" style="--bubble-delay: 0.7s; --bubble-height: 11px;" href="projects.html">Projects</a>
        <a class="bubble bubble--medium bubble--d" data-index="3" style="--bubble-delay: 1.05s; --bubble-height: 7px;" href="volunteering.html">Volunteering</a>
      </div>
      <div class="hero-row">
        <a class="bubble bubble--small bubble--e" data-index="4" style="--bubble-delay: 0.2s; --bubble-height: 6px;" href="honours-awards.html">Honours and Awards</a>
        <a class="bubble bubble--medium bubble--f" data-index="5" style="--bubble-delay: 0.5s; --bubble-height: 10px;" href="about.html">About</a>
        <a class="bubble bubble--small bubble--g" data-index="6" style="--bubble-delay: 0.85s; --bubble-height: 6px;" href="contact.html">Contact</a>
      </div>
    </nav>
  </header>
  <script>
    const bubbles = document.querySelectorAll('.hero-nav .bubble');
    const nav = document.querySelector('.hero-nav');

    bubbles.forEach((bubble) => {
      bubble.addEventListener('mouseenter', () => {
        bubble.style.setProperty('--bubble-scale', 1.08);
        bubble.style.setProperty('--bubble-translate', '-4px');
      });
      bubble.addEventListener('focus', () => {
        bubble.style.setProperty('--bubble-scale', 1.08);
        bubble.style.setProperty('--bubble-translate', '-4px');
      });
      bubble.addEventListener('mouseleave', () => {
        bubble.style.setProperty('--bubble-scale', 1);
        bubble.style.setProperty('--bubble-translate', '0');
      });
      bubble.addEventListener('blur', () => {
        bubble.style.setProperty('--bubble-scale', 1);
        bubble.style.setProperty('--bubble-translate', '0');
      });
    });
  </script>
</body>
</html>
