<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>


  <div>Time</div>
       
  <header class="hero-header">
    <div class="brand">
      <span class="brand-name">Hi, I'm Michael Troeung an <span id="engineer-word" class="accent-word"></span><span class="and-word">and</span> <span class="accent-word designer-word">designer</span> from Toronto, Canada.</span>
      <p class="brand-tag">I shape products and user experiences that are refined and intuitive.</p>
    </div>
  </header>





  

  <script>
    const engineerWord = document.getElementById('engineer-word');
    const word = '<engineer>';
    let index = 0;
    let deleting = false;
    let chars = [];

    if (engineerWord) {
      engineerWord.innerHTML = '';
      chars = Array.from(word).map((char) => {
        const span = document.createElement('span');
        span.className = 'engineer-char';
        span.textContent = char;
        engineerWord.appendChild(span);
        return span;
      });
    }

    const typeLoop = () => {
      if (!chars.length) return;

      if (!deleting) {
        chars[index].style.opacity = '1';
        index += 1;
        if (index === chars.length) {
          deleting = true;
          setTimeout(typeLoop, 900);
          return;
        }
      } else {


        console.log(String(index));

        const wordLength = word.length;
        if(index > 1 & index < wordLength){
        chars[index - 1].style.opacity = '0';
        }
        
        
        index -= 1;
        if (index === 0) {
          deleting = false;
          setTimeout(typeLoop, 300);
          return;
        }
      }

      const delay = deleting ? 90 : 120;
      setTimeout(typeLoop, delay);
    };

    typeLoop();
  </script>
</body>
</html>
